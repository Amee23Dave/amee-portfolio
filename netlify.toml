# =========================================================
# NETLIFY.TOML
# Amee Dave — portfolio site configuration.
# No paid Netlify features are required by anything below.
# =========================================================

[build]
  # The repo root IS the site root (index.html lives at the top level),
  # so the publish directory is simply ".".
  publish = "."

# ---------------------------------------------------------
# CLEAN URLS
# Let visitors use /about instead of /about.html, etc.
# (Direct .html links keep working too — these are additive.)
# ---------------------------------------------------------
[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/work"
  to = "/index.html#work"
  status = 200

[[redirects]]
  from = "/projects/:slug"
  to = "/projects/:slug.html"
  status = 200

# ---------------------------------------------------------
# CUSTOM 404
# Netlify serves 404.html automatically for unmatched paths
# when it sits at the publish root — this rule makes that
# explicit and preserves a real 404 status code for SEO.
# ---------------------------------------------------------
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# ---------------------------------------------------------
# SECURITY HEADERS
# CSP is intentionally permissive on media/frame sources so
# externally hosted video (Vimeo / Cloudflare Stream / Bunny
# Stream) and Google Fonts keep working. Tighten as needed.
# ---------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://plausible.io; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; media-src 'self' https:; connect-src 'self' https://plausible.io; frame-src https://player.vimeo.com https://iframe.mediadelivery.net; base-uri 'self'; form-action 'self'"

# ---------------------------------------------------------
# CACHE HEADERS
# Moderate lifetimes on purpose: placeholder media in this
# repo gets replaced in place (same filenames) as real assets
# arrive, so we avoid `immutable` / very long max-age until
# the project moves to fingerprinted filenames.
# ---------------------------------------------------------
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/assets/videos/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

[[headers]]
  for = "/assets/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

[[headers]]
  for = "/assets/posters/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

[[headers]]
  for = "/assets/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"
