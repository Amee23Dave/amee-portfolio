# =========================================================
# NETLIFY.TOML — kept in sync with vercel.json so the site can
# be hosted on either platform. No paid features required.
# =========================================================

[build]
  publish = "."

# Old project URLs → renamed pages (force: the old files are stubs)
[[redirects]]
  from = "/projects/luxury-watch-film"
  to = "/projects/badminton-women-player.html"
  status = 301
  force = true

[[redirects]]
  from = "/projects/luxury-watch-film.html"
  to = "/projects/badminton-women-player.html"
  status = 301
  force = true

[[redirects]]
  from = "/projects/perfume-product-film"
  to = "/projects/aqua-hydration-serum.html"
  status = 301
  force = true

[[redirects]]
  from = "/projects/perfume-product-film.html"
  to = "/projects/aqua-hydration-serum.html"
  status = 301
  force = true

[[redirects]]
  from = "/projects/sportswear-ai-film"
  to = "/projects/mahalaxmi-tea-masala.html"
  status = 301
  force = true

[[redirects]]
  from = "/projects/sportswear-ai-film.html"
  to = "/projects/mahalaxmi-tea-masala.html"
  status = 301
  force = true

[[redirects]]
  from = "/projects/ceramic-product-film"
  to = "/projects/e-motorad-electric-cycle.html"
  status = 301
  force = true

[[redirects]]
  from = "/projects/ceramic-product-film.html"
  to = "/projects/e-motorad-electric-cycle.html"
  status = 301
  force = true

[[redirects]]
  from = "/projects/brand-story-film"
  to = "/work.html"
  status = 301
  force = true

[[redirects]]
  from = "/projects/brand-story-film.html"
  to = "/work.html"
  status = 301
  force = true

[[redirects]]
  from = "/projects/portfolio"
  to = "/work.html"
  status = 301
  force = true

[[redirects]]
  from = "/projects/portfolio.html"
  to = "/work.html"
  status = 301
  force = true

# Clean URLs
[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 200

[[redirects]]
  from = "/work"
  to = "/work.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/projects/:slug"
  to = "/projects/:slug.html"
  status = 200

# Custom 404
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://plausible.io; style-src 'self'; font-src 'self'; img-src 'self' data: https:; media-src 'self' https:; connect-src 'self' https://plausible.io; frame-src https://player.vimeo.com https://iframe.mediadelivery.net; base-uri 'self'; form-action 'self' mailto:; object-src 'none'"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/work/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

[[headers]]
  for = "/assets/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

[[headers]]
  for = "/assets/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"
